name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  # "@claude review" on a pull request: findings are posted on the changed lines.
  review:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.issue.number }} in ${{ github.repository }}.

            1. Read the changes with `gh pr diff ${{ github.event.issue.number }}`.
            2. For each real problem, post one inline comment on the exact changed line using
               mcp__github_inline_comment__create_inline_comment with confirmed: true.
               Explain the problem briefly. When the fix is a small replacement, include a
               GitHub suggestion block.
            3. Finish with one short comment using `gh pr comment ${{ github.event.issue.number }}`:
               the verdict and the number of findings. Do not repeat the findings there.

            Skip style preferences and anything you have not confirmed in the code.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"

  # Any other @claude request: Claude replies in a comment and can push changes.
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      !(github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude review'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
