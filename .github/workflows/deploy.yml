name: Build & Deploy Vite site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

# The newest run wins, so an older build can't overwrite a newer one.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_EMAILJS_USER_ID:        ${{ secrets.VITE_EMAILJS_USER_ID }}
          VITE_EMAILJS_SERVICE_ID:     ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_NOTIFY_TO:      ${{ secrets.VITE_EMAILJS_NOTIFY_TO }}
          VITE_EMAILJS_TEMPLATE_NOTIFY: ${{ secrets.VITE_EMAILJS_TEMPLATE_NOTIFY }}
          VITE_EMAILJS_TEMPLATE_REPLY:  ${{ secrets.VITE_EMAILJS_TEMPLATE_REPLY }}
          VITE_RECAPTCHA_SITE_KEY:     ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3
        with:
          github_token:    ${{ secrets.GITHUB_TOKEN }}
          publish_dir:     ./dist
          branch:          gh-pages
          force_orphan:    true
