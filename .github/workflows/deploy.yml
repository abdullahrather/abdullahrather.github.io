name: Build & Deploy Vite site to GitHub Pages

# Builds the site and hands it straight to GitHub Pages: nothing built is kept in a branch.
# The repository's Settings → Pages source must be "GitHub Actions".
#
# Content: the repository's own content/ folder, which is the demo, unless the repository
# variable CONTENT_REPO names a repository that holds your own content folder. Then that
# repository is checked out with the CONTENT_TOKEN secret and used instead. If it can't be
# read, the deploy stops and the live site stays as it is.
on:
  push:
    branches:
      - main
  # Once a day, so the GitHub activity section stays current without a merge.
  schedule:
    - cron: "17 5 * * *"
  # Also started by a change in the content repository.
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A deploy that has started finishes; a waiting older one is dropped.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CONTENT_REPO: ${{ vars.CONTENT_REPO }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check out the site's own content
        if: env.CONTENT_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CONTENT_REPO }}
          token: ${{ secrets.CONTENT_TOKEN }}
          path: own-content

      - name: Use the site's own content
        if: env.CONTENT_REPO != ''
        run: echo "CONTENT_DIR=own-content" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Public data only. If GitHub can't be reached, the saved copy in the content folder is used.
      - name: Refresh GitHub activity
        run: npm run activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the content
        run: npm run check:content

      - name: Build
        run: npm run build
        env:
          VITE_EMAILJS_USER_ID: ${{ secrets.VITE_EMAILJS_USER_ID }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_NOTIFY_TO: ${{ secrets.VITE_EMAILJS_NOTIFY_TO }}
          VITE_EMAILJS_TEMPLATE_NOTIFY: ${{ secrets.VITE_EMAILJS_TEMPLATE_NOTIFY }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}

      # Pull requests test the demo content; this tests the content that is about to go live.
      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Smoke and accessibility checks
        run: npm run test:smoke

      - name: Package the site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
